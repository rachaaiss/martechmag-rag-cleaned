<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MartechMag - Dashboard RAG Expert</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --user-bg: #0f172a;
            --user-text: #ffffff;
            --bot-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .chat-header {
            background: var(--primary);
            color: #fff;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #94a3b8;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #f8fafc;
        }

        .message {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 80%;
            word-break: break-word;
        }

        .bot-message {
            background: var(--bot-bg);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .user-message {
            background: var(--user-bg);
            color: var(--user-text);
            align-self: flex-end;
        }

        .suggestions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .suggestion-chip {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #334155;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .suggestion-chip:hover {
            background: #e2e8f0;
        }

        .sources-box {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 11px;
            color: var(--text-muted);
        }

        .sources-box span {
            font-weight: 600;
            color: var(--primary);
        }

        .chat-footer {
            padding: 16px;
            background: #ffffff;
            border-top: 1px solid var(--border);
        }

        #chat-form {
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #chat-input:focus {
            border-color: var(--primary);
        }

        #chat-submit {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #chat-submit:hover {
            background: var(--primary-hover);
        }

        .chat-branding {
            text-align: center;
            font-size: 10px;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="status-dot"></div>
            <div>
                <h2>MartechMag Expert Dashboard</h2>
                <p>Analyse intelligente basée sur les articles et Lab Reports</p>
            </div>
        </div>
        
        <div class="chat-body" id="chat-messages">
            <div class="message bot-message">
                Hello! I am MartechMag's AI assistant. I answer your questions strictly based on our articles and Lab Reports. What would you like to explore?
                <div class="suggestions">
                    <button class="suggestion-chip">What is ABM?</button>
                    <button class="suggestion-chip">What is the CPV framework?</button>
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Ask a marketing question..." autocomplete="off" required>
                <button type="submit" id="chat-submit">Send</button>
            </form>
            <div class="chat-branding">Powered by MartechMag RAG</div>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        // URL de ton API Vercel en production
        const API_URL = 'https://martechmag-rag-cleaned.vercel.app/api/ask';

        // Gestion des boutons de suggestion prédéfinis
        document.addEventListener('click', async (e) => {
            if (e.target.classList.contains('suggestion-chip')) {
                const question = e.target.textContent;
                chatInput.value = question;
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Soumission du formulaire
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = chatInput.value.trim();
            if (!question) return;

            // Ajout du message utilisateur
            appendMessage(question, 'user-message');
            chatInput.value = '';

            // Message de chargement temporaire
            const loadingId = appendMessage('Searching through Lab Reports and articles...', 'bot-message loading');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.answer) {
                    let formattedAnswer = data.answer;
                    
                    // Injection dynamique des sources si elles existent
                    if (data.sources && data.sources.length > 0) {
                        formattedAnswer += `<div class="sources-box"><span>Sources:</span> ${data.sources.map(s => s.title).join(' • ')}</div>`;
                    }

                    appendMessage(formattedAnswer, 'bot-message', true);
                } else {
                    appendMessage("Sorry, an error occurred.", 'bot-message');
                }

            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage("Unable to connect to the RAG server.", 'bot-message');
            }
        });

        function appendMessage(text, className, isHTML = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            const id = 'msg-' + Date.now();
            msgDiv.id = id;

            if (isHTML) {
                msgDiv.innerHTML = text;
            } else {
                msgDiv.textContent = text;
            }

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
